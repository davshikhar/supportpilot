spring.application.name=supportpilot
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.1:8b
spring.ai.ollama.chat.temperature=0.2
spring.ai.ollama.embedding.model=nomic-embed-text
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.ai.vectorstore.redis.uri=redis://localhost:6379
spring.ai.vectorstore.redis.index-name=supportpilot-docs
spring.ai.vectorstore.redis.prefix=doc:
spring.ai.vectorstore.redis.initialize-schema=true
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration
spring.datasource.url=jdbc:postgresql://localhost:5432/supportpilot
spring.datasource.username=supportpilot
spring.datasource.password=${DB_PASSWORD:supportpilot}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
supportpilot.memory.ttl-minutes=1

supportpilot.cache.threshold=0.90

management.endpoints.web.exposure.include=health,metrics
